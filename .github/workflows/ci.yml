#
#  Runs what scripts/check.sh and scripts/publish.sh run, so neither depends on
#  someone remembering to run it by hand.
# =============================================================================
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux - check, root tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # check.sh type-checks the #[cfg(windows)] paths with this target and
          # skips that step without it.
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: check.sh (fmt, clippy, tests, Windows type-check) as a normal user
        run: ./scripts/check.sh

      # Root is what the tool runs as, and the only user for whom a task that
      # ignores dry-run actually changes the machine. As an ordinary user the
      # writes fail on permissions and such a test still passes - which is how
      # the dry-run race in run_log went unnoticed. Every file_ops write leaves
      # a .pinnacle.bak and a "PinnacleCyPat" marker, so either one appearing
      # under /etc means a test wrote for real.
      - name: Tests as root, and prove /etc was not touched
        run: |
          sudo -E env "PATH=$PATH" cargo test --workspace --manifest-path rust/Cargo.toml
          if sudo find /etc -name '*.pinnacle.bak' | grep .; then
            echo "::error::a test wrote to /etc (backup files above)"; exit 1
          fi
          if sudo grep -rIl 'PinnacleCyPat' /etc; then
            echo "::error::a test wrote to /etc (files above)"; exit 1
          fi

  publish:
    name: Release binaries (musl Linux, Windows GNU)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: mingw linker for the Windows cross build
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      # publish.sh fails the build if the Linux binary links glibc - the failure
      # that otherwise appears only on the Ubuntu 22.04 competition image.
      - run: ./scripts/publish.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pinnacle-cypat-${{ github.sha }}
          path: |
            publish-linux-x64/pinnacle-cypat
            publish-win-x64/pinnacle-cypat.exe
          if-no-files-found: error

  windows:
    name: Windows - tests
    # A Linux host never compiles crates/windows/src/native or the
    # #[cfg(windows)] branches, so only a Windows runner actually tests them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --manifest-path rust/Cargo.toml

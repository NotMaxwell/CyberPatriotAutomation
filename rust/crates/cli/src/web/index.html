<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PinnacleCyPat</title>
<style>
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --sidebar: #ECEFF5; --border: #DDE2EA;
  --text: #1B2333; --muted: #646E80;
  --accent: #1D4ED8; --accent-soft: #E6EEFD;
  --success: #166534; --success-soft: #E5F6EA;
  --warning: #B45309; --warning-soft: #FDF2E1;
  --danger: #C52222; --danger-soft: #FCE8E8;
  --neutral-soft: #EEF1F6; --hover: #E3E8F1; --code: #F1F4F9;
  --radius: 10px;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14.5px/1.45 system-ui, "Segoe UI", Inter, Cantarell, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.bold { font-weight: 600; }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
header.top .name { font-size: 19px; font-weight: 700; }
header.top .ver { color: var(--muted); font-size: 12.5px; }
header.top .pills { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
footer.status {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 20px; color: var(--muted); font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.offline { background: var(--danger); color: #fff; padding: 8px 20px; font-weight: 600; text-align: center; }

.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 0; flex: 1 1 auto; }
header.top, footer.status, .offline { flex: none; }
aside.side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 12px; overflow: auto; }
main.main { overflow: auto; padding: 20px 24px 28px; min-width: 0; }
.page { max-width: 1040px; margin: 0 auto; }
.page > * + *, .slot > * + *, .stack > * + * { margin-top: 12px; }
.slot { display: block; }
.slot:empty { display: none; }
.page-title { font-size: 25px; font-weight: 700; margin-bottom: 2px; }
.page-sub { color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }

.tabbtn {
  display: flex; width: 100%; align-items: center; justify-content: space-between;
  padding: 11px 12px; border: 0; border-radius: 8px; background: transparent;
  font-weight: 600; cursor: pointer; text-align: left; margin-bottom: 4px;
}
.tabbtn:hover { background: var(--hover); }
.tabbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0 12px; }
.side .hand-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 13.5px; cursor: pointer; }
.check input { margin-top: 3px; flex: none; }
.check.done span { color: var(--muted); text-decoration: line-through; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card > * + * { margin-top: 10px; }
.card h2 { font-size: 17px; font-weight: 650; }
.card .lead { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.top { align-items: flex-start; flex-wrap: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { margin-left: auto; }
.pill {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--neutral-soft); color: var(--muted); white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.success { background: var(--success-soft); color: var(--success); }
.pill.warning { background: var(--warning-soft); color: var(--warning); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.fixed { min-width: 84px; text-align: center; }
.tabbtn .pill { font-size: 12px; }

.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #1a44bd; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn.danger:hover:not(:disabled) { background: #a81d1d; }
.btn.small { padding: 3px 10px; font-size: 12.5px; }
.btn.link { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 8px; font-size: 12.5px; }
.btn.link:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.callout { border-radius: 8px; padding: 10px 14px; border: 1px solid; }
.callout.info { background: var(--accent-soft); border-color: #c4d4f8; color: var(--accent); font-weight: 600; }
.callout.success { background: var(--success-soft); border-color: #bfe3ca; color: var(--success); font-weight: 600; }
.callout.warning { background: var(--warning-soft); border-color: #f1d3a6; color: var(--warning); }
.callout.danger { background: var(--danger-soft); border-color: #f2bcbc; color: var(--danger); }
.callout .t { font-weight: 700; margin-bottom: 2px; }

.tiles { display: flex; gap: 10px; flex-wrap: wrap; }
.tile { background: var(--neutral-soft); border-radius: 8px; padding: 10px 14px; min-width: 100px; }
.tile .v { font-size: 22px; font-weight: 700; line-height: 1.2; }
.tile .l { color: var(--muted); font-size: 12.5px; }
.tile.accent { background: var(--accent-soft); } .tile.accent .v { color: var(--accent); }
.tile.success { background: var(--success-soft); } .tile.success .v { color: var(--success); }
.tile.danger { background: var(--danger-soft); } .tile.danger .v { color: var(--danger); }
.tile.warning { background: var(--warning-soft); } .tile.warning .v { color: var(--warning); }

.group { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.group.manual { background: var(--warning-soft); border-color: #f1d3a6; }
.group.manual > h3 { color: var(--warning); }
.group.auto > h3 { color: var(--success); }
.group h3 { font-size: 14.5px; font-weight: 650; }
.group > * + * { margin-top: 8px; }
.directive .subj { font-weight: 650; }
.directive .det { color: var(--muted); font-size: 12.5px; }

input[type=text], input[type=search], textarea {
  width: 100%; background: #F8F9FC; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; min-width: 0;
}
input[type=text]:focus, input[type=search]:focus, textarea:focus { background: #fff; border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
textarea { resize: vertical; }
label.lbl { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields .wide { grid-column: 1 / -1; }

table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; vertical-align: middle; }
table.ed td { padding: 4px 6px; }
table.ed td.c, table.ed th.c { text-align: center; width: 1%; }
table.tasks tr.main td { border-top: 1px solid var(--border); padding-top: 10px; padding-bottom: 2px; }
table.tasks tr.msg td { padding-top: 0; padding-bottom: 8px; color: var(--muted); }

.list-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--neutral-soft); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); border-radius: 999px; width: 20px; height: 20px; line-height: 1; }
.chip button:hover { background: var(--danger-soft); color: var(--danger); }
.chip.filter { padding: 4px 12px; cursor: pointer; border: 1px solid transparent; font-weight: 600; color: var(--muted); }
.chip.filter:hover:not(:disabled) { background: var(--hover); }
.chip.filter:disabled { opacity: .45; cursor: not-allowed; }
.chip.filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: #c4d4f8; }

.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper .dot { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; background: var(--neutral-soft); color: var(--muted); }
.stepper .step { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.stepper .step.cur { color: var(--text); font-weight: 650; }
.stepper .step.cur .dot { background: var(--accent); color: #fff; }
.stepper .step.done .dot { background: var(--success); color: #fff; }
.stepper .line { width: 28px; height: 1px; background: var(--border); }

.taskgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
.taskitem { padding: 6px 0; }
.taskitem.off { opacity: .55; }
.taskitem .detail { margin-left: 26px; color: var(--muted); font-size: 12.5px; }
.taskitem label { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; flex-wrap: wrap; }
.taskitem.off label { cursor: not-allowed; }
.taskitem input { width: 16px; height: 16px; margin: 0; }
.cmd { background: var(--code); border-radius: 6px; padding: 7px 10px; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; flex: 1 1 300px; }

.bar { background: #F8F9FC; border-radius: 999px; height: 24px; overflow: hidden; border: 1px solid var(--border); }
.bar > div { height: 100%; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; padding: 3px 12px; white-space: nowrap; min-width: 24px; transition: width .25s; }
.bar.danger > div { background: var(--danger); }
.runrow { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 5px 0; align-items: start; }
.runrow .nm { font-weight: 650; }
.runrow .msg { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
pre.out {
  margin: 0; background: #F8F9FC; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; max-height: 300px; overflow: auto; font: 12.5px/1.45 var(--mono);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
pre.out .sec { font-weight: 700; color: var(--accent); display: block; margin-top: 6px; }

.ledger-row { border-top: 1px solid var(--border); }
.ledger-row > button {
  display: grid; grid-template-columns: 110px 190px 1fr 18px; gap: 10px; align-items: center;
  width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 4px; cursor: pointer;
}
.ledger-row > button:hover { background: #F6F8FB; }
.ledger-row .tgt { overflow-wrap: anywhere; }
.ledger-body { margin: 0; padding: 4px 8px 12px 124px; display: grid; grid-template-columns: 80px 1fr; gap: 4px 10px; font-size: 13.5px; }
.ledger-body dt { color: var(--muted); font-weight: 600; }
.ledger-body dd { margin: 0; overflow-wrap: anywhere; }

.scrim { position: fixed; inset: 0; background: rgba(27,35,51,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.scrim.over { z-index: 60; }
.modal {
  background: var(--surface); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px;
}
.modal.wide { width: min(720px, 100%); }
.modal > * + * { margin-top: 12px; }
.modal h2 { font-size: 20px; font-weight: 700; }
.cand { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.cand:hover:not(:disabled) { background: #F6F8FB; }
.cand[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.cand:disabled { opacity: .6; cursor: not-allowed; }
.cands { display: grid; gap: 8px; max-height: 240px; overflow: auto; padding: 2px; }
.fb-list { border: 1px solid var(--border); border-radius: 8px; height: 300px; overflow: auto; }
.fb-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #EEF1F6; }
.fb-item:hover { background: #F6F8FB; }
.fb-item[aria-selected="true"] { background: var(--accent-soft); }
.fb-item.readme .nm { font-weight: 650; color: var(--accent); }
.fb-item .ic { width: 18px; text-align: center; flex: none; }
.fb-item .nm { overflow-wrap: anywhere; }

.savebar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 -4px 14px rgba(27,35,51,.07);
}
.slot.sticky { position: sticky; bottom: 0; z-index: 5; }
.toast {
  position: fixed; right: 20px; bottom: 56px; background: var(--surface); border: 1px solid var(--text);
  border-radius: 10px; padding: 11px 16px; font-weight: 650; z-index: 80; box-shadow: 0 6px 20px rgba(0,0,0,.15);
}
.toast.success { color: var(--success); }
.toast.fail { color: var(--danger); }
[hidden] { display: none !important; }

@media (max-width: 1100px) {
  .fields { grid-template-columns: 1fr; }
  .shell { grid-template-columns: 190px 1fr; }
  main.main { padding: 16px; }
  .ledger-row > button { grid-template-columns: 100px 1fr 18px; }
  .ledger-row > button .tk { display: none; }
  .ledger-body { padding-left: 12px; }
}
</style>
</head>
<body>
<div id="offline" class="offline" role="alert" hidden>Disconnected — is pinnacle-cypat still running?</div>
<header class="top" id="top"></header>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <main class="main" id="main"></main>
</div>
<footer class="status" id="status"></footer>
<div id="modals"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
"use strict";
// ---------- plumbing ----------
const TOKEN = new URLSearchParams(location.search).get("t") || "";
try { history.replaceState(null, "", location.pathname); } catch (e) { /* keep going */ }
const tq = (extra) => "t=" + encodeURIComponent(TOKEN) + (extra ? "&" + extra : "");

// DOM builder: every string becomes a text node, never markup (README text is untrusted).
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") e[k] = v;
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, String(v));
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else if (c instanceof Node) e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return e;
}
const fill = (el, ...kids) => el.replaceChildren(...h('div', {}, ...kids).childNodes);
let uid = 0;
const nid = (p) => p + "-" + (++uid);
const clone = (o) => JSON.parse(JSON.stringify(o));
const J = (o) => JSON.stringify(o);
const noElapsed = (o) => JSON.stringify(o, (k, v) => (k === "elapsed_secs" ? undefined : v));
const fmtDur = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const pill = (text, tone, cls, extra) => h("span", Object.assign({ class: "pill " + (tone || "") + (cls ? " " + cls : "") }, extra || {}), text);
const kindTitle = (k) => (k === "real" ? "Real run" : "Dry run");

let snap = null;
const ui = {
  tab: null, connected: true, localError: null,
  pickPath: null, pickSel: null, browser: null,
  draft: null, draftSig: null, dirty: false, dv: 0, newKey: null,
  search: "", filter: "all", expanded: new Set(), shown: 100,
  outStick: true, toastSig: null, toastHidden: false, snapAt: 0, showPasswords: false,
};

async function post(path, body) {
  const r = await fetch(path + "?" + tq(), {
    method: "POST", headers: { "Content-Type": "application/json", "X-Pinnacle-Token": TOKEN },
    body: JSON.stringify(body),
  });
  return r.json();
}
async function act(action) {
  let ok = false;
  try {
    const r = await post("/api/action", action);
    ok = !(r && r.ok === false);
    ui.localError = ok ? null : (r.error || "The action was refused.");
    if (!ok) render();
  } catch (e) {
    ui.localError = "Could not reach pinnacle-cypat: " + e.message;
    render();
  }
  await refresh();
  return ok;
}
async function refresh() {
  try {
    const r = await fetch("/api/state?" + tq(), { headers: { "X-Pinnacle-Token": TOKEN } });
    if (r.ok) apply(await r.json());
  } catch (e) { /* the event stream reports connectivity */ }
}

// ---------- event stream ----------
let es = null, backoff = 1000;
function connect() {
  es = new EventSource("/api/events?" + tq());
  es.addEventListener("state", (ev) => { try { apply(JSON.parse(ev.data)); } catch (e) { console.warn(e); } });
  es.onopen = () => { backoff = 1000; ui.connected = true; document.getElementById("offline").hidden = true; };
  es.onerror = () => {
    ui.connected = false; document.getElementById("offline").hidden = false;
    es.close();
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  };
}

// ---------- snapshot handling ----------
function apply(s) {
  const prev = snap;
  snap = s;
  ui.snapAt = performance.now();
  ui.connected = true; document.getElementById("offline").hidden = true;
  if (ui.tab === null) ui.tab = s.tab || "readme";
  if (prev) {
    if (!prev.active && s.active) ui.tab = "run";
    if (prev.active && !s.active && s.latest_finished) { ui.tab = "results"; ui.filter = "all"; ui.expanded.clear(); }
  }
  const ts = s.toast ? J(s.toast) : null;
  if (ts !== ui.toastSig) {
    ui.toastSig = ts; ui.toastHidden = false;
    if (ts) setTimeout(() => { if (ui.toastSig === ts) { ui.toastHidden = true; renderToast(); } }, 4500);
  }
  if (s.locations_open && ui.pickPath === null) ui.pickPath = s.readme_path || "";
  if (!s.locations_open) { ui.pickPath = null; ui.pickSel = null; ui.browser = null; }
  render();
}
function setTab(t) { ui.tab = t; render(); post("/api/action", { type: "set_tab", tab: t }).catch(() => {}); }

// ---------- slots: rebuild a region only when its inputs change ----------
function slot(parent, key, sig, build) {
  parent._s = parent._s || new Map();
  let s = parent._s.get(key);
  if (!s) { s = { el: h("div", { class: "slot" + (key === "save" ? " sticky" : "") }), sig: undefined }; parent._s.set(key, s); }
  if (s.sig !== sig) {
    s.sig = sig;
    s.el.replaceChildren(...[].concat(build()).filter(Boolean));
    s.el.querySelectorAll("[data-nf]").forEach((n) => { n.focus(); n.removeAttribute("data-nf"); });
  }
  return s.el;
}
function slots(parent, list) {
  const els = list.map(([k, sig, build]) => slot(parent, k, sig, build));
  els.forEach((e, i) => { if (parent.children[i] !== e) parent.insertBefore(e, parent.children[i] || null); });
  while (parent.children.length > els.length) parent.lastChild.remove();
}

// ---------- derived ----------
const rd = () => (snap && snap.readme ? snap.readme.effective : null);
const hasReadme = () => !!rd();
const rosterEmpty = () => { const d = rd(); return !!d && (d.administrators || []).length === 0 && (d.users || []).length === 0; };
const runOf = (k) => (snap ? snap[k] : null);
const activeRun = () => (snap && snap.active ? snap[snap.active] : null);
const counts = (run) => {
  const c = { fixed: 0, already_ok: 0, skipped: 0, failed: 0, unverified: 0 };
  for (const f of (run && run.summary ? run.summary.fixes : [])) {
    if (f.outcome === "fixed") c.fixed++;
    else if (f.outcome === "already_ok") c.already_ok++;
    else if (f.outcome === "failed") c.failed++;
    else if (f.outcome === "unverified") c.unverified++;
    else c.skipped++;
  }
  return c;
};
const liveElapsed = (r) => r.elapsed_secs + (r.finished ? 0 : (performance.now() - ui.snapAt) / 1000);

// ---------- render root ----------
function render() {
  if (!snap) return;
  renderTop(); renderSide(); renderMain(); renderStatus(); renderModals(); renderToast();
}

function renderTop() {
  const el = document.getElementById("top");
  const sig = J([snap.version, snap.privileged, snap.privileged_role, snap.active, !!snap.readme, snap.readme && snap.readme.edited, snap.inspecting]);
  if (el._sig === sig) return; el._sig = sig;
  const pills = [];
  pills.push(snap.privileged
    ? pill("Running as " + snap.privileged_role, "success")
    : pill("Not " + snap.privileged_role + " — preview only", "warning", "", { title: snap.elevation_hint || "" }));
  if (snap.readme && snap.readme.edited) pills.push(pill("README edited", "warning"));

    h("div", { class: "row" },
      h("span", { class: "muted small grow", style: "overflow-wrap:anywhere" }, selEntry ? selEntry.path : "Double-click a file, or select it and press Select."),
      h("button", { class: "btn", onclick: () => { ui.browser = null; render(); } }, "Cancel"),
      h("button", { class: "btn primary", disabled: !selEntry, onclick: () => selEntry && pickFile(selEntry.path) }, "Select")));
}

// ---------- boot ----------
refresh();
connect();
</script>
</body>
</html>

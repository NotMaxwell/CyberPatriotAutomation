[package]
name = "pinnacle-cypat"
description = "Automates CyberPatriot competition security hardening, driven by the round's own README."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pinnacle-cypat"
path = "src/main.rs"

[dependencies]
pinnacle-core.workspace = true
tokio.workspace = true
indicatif.workspace = true

# The platform crates are cfg-gated dependencies, so a Windows build never
# compiles the Linux tasks and a Linux build never compiles the Win32 bindings.
[target.'cfg(windows)'.dependencies]
pinnacle-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pinnacle-linux.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[package]
name = "pinnacle-cypat"
# Bump with every behavioural change and record it in CHANGELOG.md. The run log
# stamps this value in its header and file name so a log ties back to its build.
version = "1.15.0"
edition = "2021"
build = "build.rs"
authors = ["Maxwell McCormick"]
description = "Automates CyberPatriot competition security hardening tasks for Windows systems (Rust port)."
# Proprietary; see ../LICENSE. `publish = false` is what stops `cargo publish`
# from uploading a crate whose license forbids redistribution.
license-file = "../LICENSE"
publish = false

[[bin]]
name = "pinnacle-cypat"
path = "src/main.rs"

[lib]
name = "pinnacle_cypat"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
async-trait = "0.1"
regex = "1"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
comfy-table = { version = "7", features = ["custom_styling"] }
indicatif = "0.17"
owo-colors = "4"
scraper = "0.27.0"
ego-tree = "0.11.0"

[target.'cfg(windows)'.dependencies]
# Microsoft's official Windows bindings. Everything under `src/native` is built
# on these rather than on parsing the output of `net`, `auditpol` and `netsh`,
# mirroring how the C# port uses CsWin32. One binding crate for the whole
# project, so there is a single place to add an API.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    # Console: turn on the virtual-terminal flag at startup so ANSI sequences
    # render from the very first line of output.
    "Win32_System_Console",
    # Local accounts and password policy (netapi32).
    "Win32_NetworkManagement_NetManagement",
    # Audit policy, and the token privilege it requires (advapi32).
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Threading",
    # Windows Firewall configuration, which is a COM object.
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    # Service control manager.
    "Win32_System_Services",
    # Installed-software inventory from the uninstall keys.
    "Win32_System_Registry",
    # Shared folders. The Win32 metadata files NetShareEnum and NetShareDel
    # under Storage rather than with the rest of netapi32.
    "Win32_Storage_FileSystem",
    # DNS server addresses per interface, from the IP helper API.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
insta = "1.48.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The shipping profile. Measured on the win-x64 cross build: 2.50 MB with cargo's
# defaults for codegen-units and panic, 2.12 MB with the settings below.
[profile.release]
# Optimise across crate boundaries, not just within each crate.
lto = true
# One codegen unit lets LLVM see the whole crate at once. Slower to build and
# worth roughly 8% of the binary.
codegen-units = 1
# Optimise for size rather than speed. The run is dominated by process spawns,
# network fetches and Defender scans, so faster codegen buys nothing measurable
# while `opt-level = 3` costs about 900 KB.
opt-level = "z"
# Abort instead of unwinding. Nothing here calls `catch_unwind`, no test uses
# `#[should_panic]`, and the run log is flushed by an explicit `finish_log` call
# rather than a `Drop` impl - so a panic loses the log either way and unwinding
# buys nothing. Worth about 166 KB.
panic = "abort"
# Drop symbols; the binary ships to a competition image, not to a debugger.
strip = true

[package]
name = "cyberpatriot-automation"
# Bump with every behavioural change and record it in CHANGELOG.md. The run log
# stamps this value in its header and file name so a log ties back to its build.
version = "1.8.0"
edition = "2021"
build = "build.rs"
authors = ["Maxwell McCormick"]
description = "Automates CyberPatriot competition security hardening tasks for Windows systems (Rust port)."
license = "Apache-2.0"

[[bin]]
name = "cyberpatriot-automation"
path = "src/main.rs"

[lib]
name = "cyberpatriot_automation"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
async-trait = "0.1"
regex = "1"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
comfy-table = { version = "7", features = ["custom_styling"] }
indicatif = "0.17"
owo-colors = "4"
# `winget` aligns its table columns by terminal display width, so parsing that
# output correctly means measuring width rather than counting characters.
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
# Used only to turn on the console's virtual-terminal flag at startup so ANSI
# sequences render from the very first line of output.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
strip = true
opt-level = "z"

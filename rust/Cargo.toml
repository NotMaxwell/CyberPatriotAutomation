# =============================================================================
# PinnacleCyPat (Rust) - workspace root
# Author: Maxwell McCormick
# Copyright 2026 Maxwell McCormick
# SPDX-License-Identifier: Apache-2.0
# =============================================================================
#
# Four crates, split along the line that already existed in the code:
#
#   pinnacle-core     the OS-agnostic half - README parsing, the remediation
#                     ledger, the run log, the models, the console. Builds and
#                     is fully tested on any host.
#   pinnacle-windows  Win32 bindings, the *_ops wrappers, the hardening tables
#                     and the Windows tasks.
#   pinnacle-linux    the same shape for Linux: /etc, systemd, PAM, apt.
#   pinnacle-cypat    the binary. Selects a platform crate by cfg and knows
#                     nothing else about either.
#
# The split is what makes a second operating system additive rather than a set
# of `#[cfg]` branches threaded through every task. Two implementations kept in
# one file drift silently; two crates cannot.
[workspace]
members = ["crates/core", "crates/windows", "crates/linux", "crates/cli"]
resolver = "3"

[workspace.package]
# Bump with every behavioural change and record it in CHANGELOG.md. The run log
# stamps this value in its header and file name so a log ties back to its build.
version = "1.19.0"
edition = "2024"
authors = ["Maxwell McCormick"]
license = "Apache-2.0"
repository = "https://github.com/NotMaxwell/CyberPatriotAutomation"
# Not published to crates.io: this is an application, not a library, and there is
# nothing here another crate would depend on. The licence permits it; there is
# just no reason. Clone the repo or take a release binary.
publish = false

[workspace.dependencies]
pinnacle-core = { path = "crates/core" }
pinnacle-windows = { path = "crates/windows" }
pinnacle-linux = { path = "crates/linux" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
async-trait = "0.1"
regex = "1"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
comfy-table = { version = "7", features = ["custom_styling"] }
indicatif = "0.17"
owo-colors = "4"
scraper = "0.27.0"
ego-tree = "0.11.0"
insta = "1.48.0"

# The shipping profile, at the workspace root because cargo only honours it here.
# Measured on the win-x64 cross build: 2.50 MB with cargo's defaults for
# codegen-units and panic, 2.12 MB with the settings below.
[profile.release]
# Optimise across crate boundaries, not just within each crate. This matters
# more now than it did as a single crate: without it the platform crate and the
# core crate would not inline into each other.
lto = true
# One codegen unit lets LLVM see the whole program at once. Slower to build and
# worth roughly 8% of the binary.
codegen-units = 1
# Optimise for size rather than speed. The run is dominated by process spawns,
# network fetches and Defender scans, so faster codegen buys nothing measurable
# while `opt-level = 3` costs about 900 KB.
opt-level = "z"
# Abort instead of unwinding. Nothing here calls `catch_unwind`, no test uses
# `#[should_panic]`, and the run log is flushed by an explicit `finish_log` call
# rather than a `Drop` impl - so a panic loses the log either way and unwinding
# buys nothing. Worth about 166 KB.
panic = "abort"
# Drop symbols; the binary ships to a competition image, not to a debugger.
strip = true
